{% extends "base.html" %}

{% block title %}{{ action }} Student - Student Management System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">{{ action }} Student</h2>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name *</label>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ student.name if student else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ student.email if student else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" class="form-control" id="age" name="age"
                               value="{{ student.age if student else '' }}" min="1" max="120">
                    </div>

                    <div class="mb-3">
                        <label for="grade" class="form-label">Grade</label>
                        <select class="form-control" id="grade" name="grade">
                            <option value="">Select Grade</option>
                            <option value="A" {{ 'selected' if student and student.grade == 'A' else '' }}>A</option>
                            <option value="B" {{ 'selected' if student and student.grade == 'B' else '' }}>B</option>
                            <option value="C" {{ 'selected' if student and student.grade == 'C' else '' }}>C</option>
                            <option value="D" {{ 'selected' if student and student.grade == 'D' else '' }}>D</option>
                            <option value="F" {{ 'selected' if student and student.grade == 'F' else '' }}>F</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            {{ 'Update' if action == 'Edit' else 'Add' }} Student
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
